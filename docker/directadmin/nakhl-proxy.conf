# =============================================================================
# Nakhl Restaurant — Reverse-proxy vhost snippet برای DirectAdmin / Apache 2.4
# -----------------------------------------------------------------------------
# کجا قرار دهیم؟
#   DirectAdmin (سطح Admin) → «Custom HTTPD Configurations» → انتخاب دامنه
#   → این بلوک را در قسمت کاستوم همان دامنه قرار دهید و ذخیر کنید
#   (DA این محتوا را داخل <VirtualHost> همان دامنه درج می‌کند و با
#   rebuild هم حفظ می‌شود — مسیر فایل معادل:
#    /usr/local/directadmin/data/users/<USER>/domains/<DOMAIN>.cust_httpd )
#
# پیش‌نیاز ماژول‌های آپاچی (در بیلد استاندارد CustomBuild فعال‌اند):
#   mod_proxy  +  mod_proxy_http  +  mod_proxy_wstunnel  +  mod_headers
#   بررسی:  httpd -M 2>/dev/null | grep -E 'proxy|wstunnel|headers'
#
# پورت هدف روی میزبان: همان NAKHL_PORT که در .env گذاشته‌اید (پیش‌فرض 8080)
# و فقط روی 127.0.0.1 گوش می‌دهد — از اینترنت مستقیماً قابل دسترسی نیست.
# =============================================================================

# --- امنیت: پراکسی فقط خروجی است؛ هرگز پراکسی باز (forward) نباشد ----------
ProxyRequests Off
ProxyPreserveHost On

# --- timeouts مناسب برای اپ زنده (سفارش/چت) و آپلود تصاویر ----------------
ProxyTimeout 3600
Timeout 3600

# --- WebSocket کانال real-time (اتصال زندهٔ اعلان سفارش‌ها) ------------------
# باید «قبل از» قانون کلی «/» باشد تا اول match شود.
ProxyPass        /api/ws  ws://127.0.0.1:8080/api/ws
ProxyPassReverse /api/ws  ws://127.0.0.1:8080/api/ws

# --- کل سایت → کانتینر نخل --------------------------------------------------
ProxyPass        /  http://127.0.0.1:8080/
ProxyPassReverse /  http://127.0.0.1:8080/

# --- هدرهای کمکی برای اپ (شناسایی پروتکل واقعی پشت SSL) ---------------------
# وقتی گواهی SSL از DirectAdmin (Let's Encrypt) فعال شد، این هدر باعث می‌شود
# اپ بفهمد کاربر روی https است (برای ریدایرکت‌ها و URL های بازگشت پرداخت).
RequestHeader set X-Forwarded-Proto "https" env:HTTPS
RequestHeader set X-Forwarded-Proto "http" !env:HTTPS

# --- محدودیت حجم بدنه برای آپلود تصاویر منو/آواتار (۵MB + حاشیه) ------------
LimitRequestBody 6291456

# --- (اختیاری) فشرده‌سازی پاسخ‌های متنی را خودِ اپ انجام می‌دهد (compress:true)
# اگر mod_deflate در سطح سرور فعال است و تداخل دیدید، برای این vhost خاموش کنید:
# SetOutputFilter DEFLATE OFF
