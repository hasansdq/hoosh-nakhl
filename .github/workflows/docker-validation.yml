name: Docker validation

on:
  push:
    branches: [main, "fix/data-preserving-v13"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify business regressions without external services
        run: timeout 45s node tests/business-regressions.mjs
      - name: Verify timer and safe update failure handling
        run: python3 tests/update-progress.py
      - name: Build production image
        run: docker build -t nakhl-validation .
      - name: Verify cached TypeScript checking rejects errors
        run: |
          printf 'export const nakhlCacheTypeTest: number = "must fail";\n' > src/nakhl-cache-type-test.ts
          if docker build --progress plain -t nakhl-cache-negative . > /tmp/nakhl-cache-negative.log 2>&1; then
            cat /tmp/nakhl-cache-negative.log
            echo "ERROR: cached build accepted a TypeScript error"
            exit 1
          fi
          cat /tmp/nakhl-cache-negative.log
          grep -q 'nakhl-cache-type-test.ts' /tmp/nakhl-cache-negative.log
          grep -q 'Type error:' /tmp/nakhl-cache-negative.log
          rm src/nakhl-cache-type-test.ts
      - name: Verify database upgrade in production image
        run: |
          docker run --rm --network none --entrypoint node nakhl-validation scripts/upgrade-test.mjs
          docker run --rm --network none --entrypoint node nakhl-validation scripts/upgrade-test.mjs --legacy-6
      - name: Verify atomic migration completion and restart
        run: docker run --rm --entrypoint node nakhl-validation scripts/migration-test.mjs
      - name: Verify zero data mutations and no automatic seed
        run: docker run --rm --network none --entrypoint node nakhl-validation scripts/data-preservation-test.mjs
      - name: Start production app with temporary data
        run: |
          cp docker/env.example .env
          docker compose config --format json | jq -e '
            .name == "nakhl-restaurant" and
            .services.app.init == true and .services.app.restart == "unless-stopped" and
            .volumes["nakhl-data"].name == "nakhl-restaurant_nakhl-data" and
            any(.services.app.volumes[]; .source == "nakhl-data" and .target == "/app/data")'
          cat > "${RUNNER_TEMP}/nakhl-compose-ci.yml" <<'YAML'
          services:
            app:
              image: nakhl-validation
              container_name: nakhl-validation
          volumes:
            nakhl-data:
              name: nakhl-validation-data
          YAML
          docker compose -p nakhl-validation -f docker-compose.yml \
            -f "${RUNNER_TEMP}/nakhl-compose-ci.yml" up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify effective healthcheck and orphan reaping
        run: |
          docker image inspect nakhl-validation | jq -e '.[0].Config.Healthcheck |
            .Timeout == 6000000000 and .StartPeriod == 60000000000 and
            .Interval == 30000000000 and .Retries == 3 and
            (.Test[1] | contains("AbortSignal.timeout(4000)"))'
          docker inspect nakhl-validation | jq -e '.[0] |
            .HostConfig.Init == true and
            .Config.Healthcheck.Timeout == 6000000000 and
            (.Config.Healthcheck.Test[1] | contains("AbortSignal.timeout(4000)"))'
          docker exec nakhl-validation sh -eu -c '
            [ "$(cat /proc/1/comm)" = docker-init ]
            for process in /proc/[0-9]*/comm; do
              if [ "$(cat "$process" 2>/dev/null)" = node ]; then
                grep -Eq "^PPid:[[:space:]]+1$" "${process%/comm}/status" && break
              fi
            done
            grep -Eq "^PPid:[[:space:]]+1$" "${process%/comm}/status"
            pid=$(sh -c "sleep 2 </dev/null >/dev/null 2>&1 & echo \$!")
            grep -Eq "^PPid:[[:space:]]+1$" "/proc/$pid/status"
            for attempt in 1 2 3 4 5; do
              [ -d "/proc/$pid" ] || exit 0
              sleep 1
            done
            echo "Orphan $pid was not reaped" >&2
            exit 1
          '
          for attempt in $(seq 1 25); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' nakhl-validation)" != healthy ] || exit 0
            sleep 2
          done
          exit 1
      - name: Check health and homepage under concurrent read-only traffic
        run: |
          seq 1 80 | xargs -P 8 -I '{}' sh -ec '
            body=$(curl -fsS --max-time 8 http://127.0.0.1:8080/api/health)
            echo "$body" | jq -e ".ok and (.db == \"up\")" >/dev/null
            curl -fsS --max-time 10 http://127.0.0.1:8080/ >/dev/null'
      - name: Verify production upload routes and persistence
        run: NAKHL_UPLOAD_SMOKE=1 node tests/upload-smoke.mjs
      - name: Show logs and clean up temporary data
        if: always()
        run: |
          docker logs nakhl-validation 2>/dev/null || true
          docker rm -fv nakhl-validation 2>/dev/null || true
          docker volume rm nakhl-validation-data 2>/dev/null || true
