name: Docker validation

on:
  push:
    branches: [main, "fix/data-preserving-v13"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify business regressions without external services
        run: node tests/business-regressions.mjs
      - name: Verify timer and safe update failure handling
        run: python3 tests/update-progress.py
      - name: Build production image
        run: docker build -t nakhl-validation .
      - name: Verify cached TypeScript checking rejects errors
        run: |
          printf 'export const nakhlCacheTypeTest: number = "must fail";\n' > src/nakhl-cache-type-test.ts
          if docker build --progress plain -t nakhl-cache-negative . > /tmp/nakhl-cache-negative.log 2>&1; then
            cat /tmp/nakhl-cache-negative.log
            echo "ERROR: cached build accepted a TypeScript error"
            exit 1
          fi
          cat /tmp/nakhl-cache-negative.log
          grep -q 'nakhl-cache-type-test.ts' /tmp/nakhl-cache-negative.log
          grep -q 'Type error:' /tmp/nakhl-cache-negative.log
          rm src/nakhl-cache-type-test.ts
      - name: Verify database upgrade in production image
        run: |
          docker run --rm --network none --entrypoint node nakhl-validation scripts/upgrade-test.mjs
          docker run --rm --network none --entrypoint node nakhl-validation scripts/upgrade-test.mjs --legacy-6
      - name: Verify atomic migration completion and restart
        run: docker run --rm --entrypoint node nakhl-validation scripts/migration-test.mjs
      - name: Verify zero data mutations and no automatic seed
        run: docker run --rm --network none --entrypoint node nakhl-validation scripts/data-preservation-test.mjs
      - name: Start production app with temporary data
        run: |
          docker volume create nakhl-validation-data
          docker run -d --name nakhl-validation -p 127.0.0.1:8080:3000 \
            -v nakhl-validation-data:/app/data \
            -e NAKHL_SEED_PROFILE=prod -e ZARINPAL_FORCE_REAL=1 nakhl-validation
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Verify production upload routes and persistence
        run: NAKHL_UPLOAD_SMOKE=1 node tests/upload-smoke.mjs
      - name: Show logs and clean up temporary data
        if: always()
        run: |
          docker logs nakhl-validation 2>/dev/null || true
          docker rm -fv nakhl-validation 2>/dev/null || true
          docker volume rm nakhl-validation-data 2>/dev/null || true
